name: Build Windows EXE (unsigned)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package reconstructed executable
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Connector_Microbit-ThingSpeak-Serial_v5.1.5-test_rebuild
          --icon assets/app_icon.ico
          --add-data "assets/app_icon.png;assets"
          microbit_thingspeak_gateway.py
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: connector-windows-unsigned
          path: dist/*.exe
          if-no-files-found: error
